name: Test Android Build

# Workflow d'essai (branche separee test-android-ci-build) : reprend
# l'approche de https://github.com/abarichello/godot-ci (image Docker qui
# embarque Godot + templates d'export + SDK Android + JDK deja configures,
# aucun chemin editor_settings a fournir soi-meme). Corrige un bug repere
# dans un essai precedent sur un autre projet : le chemin du JDK avait ete
# ecrit dans le reglage android_sdk_path (qui attend le SDK Android, pas
# Java) -- avec cette image, aucun des deux n'est a configurer manuellement.
#
# --export-debug utilise le keystore de debug integre par defaut de Godot
# si aucun n'est configure -- pas besoin de generer/fournir un keystore
# pour ce test.

on:
  push:
    branches: [test-android-ci-build]
  workflow_dispatch:

jobs:
  android-debug:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Diagnostic (chemins Java / SDK Android / templates dans l'image)
        run: |
          echo "--- HOME / whoami ---"
          echo "HOME=$HOME"
          whoami

          echo "--- variables d'env liees a Java/Android ---"
          env | grep -iE "java|android|jdk|jre" || echo "(aucune variable trouvee)"

          echo "--- which java / javac ---"
          which java || echo "java introuvable dans PATH"
          which javac || echo "javac introuvable dans PATH"
          java -version 2>&1 || true

          echo "--- recherche des JDK installes ---"
          find / -maxdepth 6 -iname "*jdk*" -not -path "*/proc/*" 2>/dev/null || true

          echo "--- recherche du SDK Android (cmdline-tools / platforms / build-tools) ---"
          find / -maxdepth 6 -iname "cmdline-tools" -not -path "*/proc/*" 2>/dev/null || true
          find / -maxdepth 6 -iname "platform-tools" -not -path "*/proc/*" 2>/dev/null || true
          find / -maxdepth 8 -type d -iname "build-tools" -not -path "*/proc/*" 2>/dev/null || true

          echo "--- recherche des templates d'export Godot ---"
          find / -maxdepth 8 -iname "android_debug.apk" -not -path "*/proc/*" 2>/dev/null || true
          find / -maxdepth 6 -type d -iname "export_templates" -not -path "*/proc/*" 2>/dev/null || true

          echo "--- recherche des editor_settings baked dans l'image ---"
          find / -maxdepth 6 -iname "editor_settings*" -not -path "*/proc/*" 2>/dev/null || true

      - name: Export APK Android (debug)
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android apk" build/android/fdcn-debug.apk

      - name: Liste des fichiers produits
        run: ls -la build/android/

      - name: Upload de l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdcn-android-debug
          path: build/android/
